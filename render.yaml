services:
  - type: web
    name: foodeez
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_OWNER_EMAIL
        value: owner@foodeez.pk
      - key: SEED_OWNER_PASS
        value: ChangeMe!foodeez1
      - key: DEMO_HISTORY_DAYS
        value: 0
